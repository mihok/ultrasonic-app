name: speaker_tone_engine
description: "Low-level iOS tone engine (AVAudioEngine + AVAudioSourceNode) that renders procedurally generated tone programs in real time."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SpeakerToneEnginePlugin
